name: Hospitality AI Daily Briefing
on:
  schedule:
    - cron: '0 7,16 * * 1,3,5'  # 7am UTC M/W/F
  workflow_dispatch:      # manual trigger from Actions tab
jobs:
  run-briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # needed to commit briefing files
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create session
        id: create_session
        run: |
          BODY=$(mktemp)
          HTTP=$(curl -sS -o "$BODY" -w '%{http_code}' \
            https://api.anthropic.com/v1/sessions \
            -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: managed-agents-2026-04-01" \
            -H "content-type: application/json" \
            -d '{
              "agent": { "type": "agent", "id": "agent_011Ca5R46SM5C3GWn2n1w2vs" },
              "environment_id": "env_01QFEq9dNeWPGWX9Qm2U1Vb2",
              "title": "Briefing '"$(date +%Y-%m-%d)"'"
            }')
          echo "API returned $HTTP"
          cat "$BODY"
          [ "$HTTP" = "200" ] || exit 1
          echo "session_id=$(jq -r '.id' "$BODY")" >> "$GITHUB_OUTPUT"

      - name: Send trigger message
        run: |
          curl -sS --fail-with-body \
            "https://api.anthropic.com/v1/sessions/${{ steps.create_session.outputs.session_id }}/events" \
            -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: managed-agents-2026-04-01" \
            -H "content-type: application/json" \
            -d '{"events": [{"type": "user.message", "content": [{"type": "text", "text": "Run a briefing covering the last 2-3 days of hospitality AI news."}]}]}'

      - name: Poll for completion
        id: poll
        run: |
          SESSION_ID=${{ steps.create_session.outputs.session_id }}
          DATE=$(date +%Y-%m-%d)
          STATUS="pending"
          for i in $(seq 1 15); do
            sleep 30
            echo "Polling... attempt $i of 15"
            EVENTS=$(curl -sS \
              "https://api.anthropic.com/v1/sessions/$SESSION_ID/events" \
              -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
              -H "anthropic-version: 2023-06-01" \
              -H "anthropic-beta: managed-agents-2026-04-01")

            ERROR=$(echo $EVENTS | jq '[.data[] | select(.type == "session.status_error" or .type == "session.status_failed")] | length')
            if [ "$ERROR" -gt "0" ]; then
              echo "Agent errored out."
              REASON=$(echo $EVENTS | jq -r '[.data[] | select(.type == "session.status_error" or .type == "session.status_failed")] | last | (.error.message // .reason // "unknown")')
              echo "Reason: $REASON"
              mkdir -p briefings
              {
                echo "# Hospitality AI Briefing — $DATE"
                echo ""
                echo "_Briefing run failed._"
                echo ""
                echo "**Reason:** $REASON"
                echo ""
                echo "Check the Anthropic console for session $SESSION_ID."
              } > "briefings/$DATE.md"
              STATUS="failed"
              break
            fi

            IDLE=$(echo $EVENTS | jq '[.data[] | select(.type == "session.status_idle")] | length')
            if [ "$IDLE" -gt "0" ]; then
              echo "Agent finished."
              OUTPUT=$(echo $EVENTS | jq -r '[.data[] | select(.type == "agent.message")] | last | .content[] | select(.type == "text") | .text')
              mkdir -p briefings
              echo "# Hospitality AI Briefing — $DATE" > "briefings/$DATE.md"
              echo "" >> "briefings/$DATE.md"
              printf '%s' "$OUTPUT" >> "briefings/$DATE.md"

              INPUT_TOKENS=$(echo $EVENTS | jq '[.data[] | select(.type == "agent.message") | .usage.input_tokens // 0] | add')
              OUTPUT_TOKENS=$(echo $EVENTS | jq '[.data[] | select(.type == "agent.message") | .usage.output_tokens // 0] | add')
              echo "Tokens used: $INPUT_TOKENS input, $OUTPUT_TOKENS output"
              echo "" >> "briefings/$DATE.md"
              echo "---" >> "briefings/$DATE.md"

              STATUS="success"
              break
            fi
          done

          if [ "$STATUS" = "pending" ]; then
            echo "Polling timed out after 7.5 minutes."
            mkdir -p briefings
            {
              echo "# Hospitality AI Briefing — $DATE"
              echo ""
              echo "_Briefing run timed out._"
              echo ""
              echo "The agent did not complete within 7.5 minutes. Check session $SESSION_ID in the Anthropic console."
            } > "briefings/$DATE.md"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render static site
        run: |
          npm ci
          node scripts/build.js

      - name: Commit briefing to repo
        run: |
          git config user.name "Hospitality AI Monitor"
          git config user.email "actions@github.com"
          git add briefings/ index.html archive.html sitemap.xml
          git diff --staged --quiet || git commit -m "Briefing: $(date +%Y-%m-%d)"
          git push
